# Flight Guide — compose stack
#
# One service, one exposed port, one named volume for persisted settings.
#
#   docker compose up --build -d
#   open http://localhost:8080
#
# The volume is what makes /admin edits survive `docker compose down` and
# restart. `down -v` deletes it and returns the app to shipped defaults.

services:
  flight-guide:
    build:
      context: .
      dockerfile: Dockerfile
    image: flight-guide:latest
    container_name: flight-guide
    restart: unless-stopped

    ports:
      # HOST_PORT is what you open in a browser; 8080 is fixed inside the image.
      - "${HOST_PORT:-8080}:8080"

    environment:
      NODE_ENV: production
      PORT: "8080"
      HOST: "0.0.0.0"
      FG_DATA_DIR: /data
      # Bump this when you deploy a new build; it is echoed by /healthz.
      FG_VERSION: "${FG_VERSION:-prototype}"
      # How many chat turns to keep in /admin's log.
      FG_MAX_CONVERSATIONS: "${FG_MAX_CONVERSATIONS:-200}"
      # Largest request body accepted, in bytes.
      FG_MAX_BODY_BYTES: "${FG_MAX_BODY_BYTES:-65536}"

    volumes:
      # Settings and the conversation log. This is the only writable path.
      - flight-guide-data:/data

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:8080/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

    # The container needs no privileges beyond what it already has.
    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  flight-guide-data:
    name: flight-guide-data
